<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCMED - Configuración de Parámetros</title>
    <link rel="stylesheet" href="estilos/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div style="display: flex; align-items: center; gap: 20px; margin-top: 20px;">
        <button onclick="window.location.href='index.html'" class="btn" style="background: #6c757d; color: white; width: auto;">⬅️ Volver</button>
        <h1>⚙️ Configuración Global de Parámetros</h1>
        <button id="btn-logout" class="btn" style="background:#dc3545;color:white;width:auto;">
        🚪 Salir
        </button>
    </div>

    <!-- 🔹 Indicador de estado -->
    <div id="status"></div>
    <div class="card" style="margin-top: 20px;">
        <form id="form-config">
            <div class="form-grid">
                <!-- Parámetro: Paginación -->
                <div>
                    <label>Cantidad de registros por página (Buscador)</label>
                    <select id="cfg_paginacion" required>
                        <option value="5">5 registros</option>
                        <option value="10">10 registros</option>
                        <option value="20">20 registros</option>
                        <option value="50">50 registros</option>
                    </select>
                </div>

                <!-- Parámetro: Estilo de Interfaz -->
                <div>
                    <label>Estilo de botones en tabla</label>
                    <select id="cfg_estilo_botones">
                        <option value="completo">Texto e Iconos</option>
                        <option value="minimal">Solo Iconos (Compacto)</option>
                    </select>
                </div>

                <!-- Parámetro: Entorno -->
                <div>
                    <label>Entorno de Ejecución</label>
                    <input type="text" id="cfg_entorno" value="PRUEBAS_V2.1" readonly style="background: #eee;">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" id="btn-save-cfg" class="btn btn-save" style="background: var(--primary);">
                    💾 Guardar Configuración en la Nube
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { auth, functions } from '/js/config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { inicializarConexion, actualizarStatus } from "/js/conexion.js";
        import { dbPut, dbGet, dbGetAll, dbDelete } from "/js/db-crud.js";

        const form = document.getElementById('form-config');
        const btnSave = document.getElementById('btn-save-cfg');

        // 🔹 Validación híbrida de sesión
        document.addEventListener("DOMContentLoaded", async () => {
            const offlineUser = await dbGet("usuarios", "offlineUser");

            if (offlineUser) {
                console.log("✅ Sesión activa (offline):", offlineUser.email);
                actualizarStatus();
            } else {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        console.log("✅ Sesión activa (online):", user.email);
                        actualizarStatus();
                    } else {
                        window.location.href = "login.html";
                    }
                });
            }
        });

        inicializarConexion();

        // 🔹 Cargar configuración actual
        async function cargarConfiguracion() {
            // 🔹 Primero intentamos leer local
            const cfgLocal = await dbGet("configuracion", "global");
            if (cfgLocal) {
                document.getElementById('cfg_paginacion').value = cfgLocal.paginacion || 10;
                document.getElementById('cfg_estilo_botones').value = cfgLocal.estiloBotones || 'completo';
            }

            if (!navigator.onLine) return;

            // 🔹 Si hay conexión, actualizamos desde la nube
            const administrarConfig = httpsCallable(functions, 'administrarConfiguracionPruebas');
            try {
                const resultado = await administrarConfig({ accion: 'obtener' });
                const cfg = resultado.data;
                if (cfg) {
                    document.getElementById('cfg_paginacion').value = cfg.paginacion || 10;
                    document.getElementById('cfg_estilo_botones').value = cfg.estiloBotones || 'completo';
                    
                    // Guardamos también en IndexedDB
                    await dbPut("configuracion", {
                        clave: "global",
                        paginacion: cfg.paginacion,
                        estiloBotones: cfg.estiloBotones
                    });
                }
            } catch (error) {
                console.error("Error cargando config vía Function:", error);
            }
        }


        // 🔹 Guardar configuración
        form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSave.disabled = true;
    btnSave.innerText = "⏳ Sincronizando...";

    const administrarConfig = httpsCallable(functions, 'administrarConfiguracionPruebas');
    const nuevosDatos = {
        paginacion: parseInt(document.getElementById('cfg_paginacion').value),
        estiloBotones: document.getElementById('cfg_estilo_botones').value,
        ultimaActualizacion: new Date().toISOString()
    };

    try {
        // Guardamos primero en IndexedDB
        await dbPut("configuracion", {
            clave: "global",
            paginacion: nuevosDatos.paginacion,
            estiloBotones: nuevosDatos.estiloBotones,
            ultimaActualizacion: nuevosDatos.ultimaActualizacion
        });

        // Si hay conexión, también actualizamos en la nube
        if (navigator.onLine) {
            await administrarConfig({ accion: 'actualizar', datos: nuevosDatos });
            Swal.fire('¡Éxito!', 'Los parámetros han sido actualizados globalmente.', 'success');
        } else {
            Swal.fire('Modo Offline', 'Los parámetros se guardaron localmente y se sincronizarán cuando haya conexión.', 'info');
        }
    } catch (error) {
        Swal.fire('Error', 'No se pudo actualizar la configuración.', 'error');
    } finally {
        btnSave.disabled = false;
        btnSave.innerText = "💾 Guardar Configuración en la Nube";
    }
});

        cargarConfiguracion();

        // 🔹 Logout híbrido
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async () => {
                const respuesta = await Swal.fire({
                    title: 'Cerrar sesión',
                    text: '¿Desea salir de SGCMED?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Salir',
                    cancelButtonText: 'Cancelar'
                });

                if (!respuesta.isConfirmed) return;

                try {
                    if (navigator.onLine) {
                        await signOut(auth);
                    }

                    // 🔹 Limpiar usuario offline
                    await dbDelete("usuarios", "offlineUser");

                    // 🔹 Limpiar todos los expedientes locales
                    /*const backup = await dbGetAll("expedientes");
                    if (backup && backup.length > 0) {
                        for (const exp of backup) {
                            await dbDelete("expedientes", exp.id);
                        }
                    }*/

                    window.location.href = 'login.html';
                } catch (error) {
                    console.error(error);
                    Swal.fire('Error','No fue posible cerrar la sesión.','error');
                }
            });
        }

     </script>

</body>
</html>
