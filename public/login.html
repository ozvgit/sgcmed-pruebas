<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCMED - Acceso Seguro</title>
    <link rel="stylesheet" href="estilos/estilos.css">
    <style>
        body{margin:0;padding:0;min-height:100vh;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif}
        .login-container{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}
        .login-card{width:100%;max-width:450px;background:#fff;border-radius:12px;padding:30px;box-shadow:0 4px 15px rgba(0,0,0,.1);box-sizing:border-box}
        .login-title{text-align:center;margin:0 0 10px;font-size:2rem}
        .login-subtitle{text-align:center;color:#666;margin-bottom:25px}
        .login-card label{display:block;margin-bottom:6px;font-weight:600}
        .login-card input{width:100%;padding:12px;border:1px solid #dcdcdc;border-radius:8px;margin-bottom:15px;box-sizing:border-box;font-size:1rem}
        .btn-login{width:100%;padding:12px;border:none;border-radius:8px;background:#0d6efd;color:#fff;cursor:pointer;font-size:1rem;font-weight:600}
        .mensaje-error{text-align:center;color:#dc3545;margin-top:15px;min-height:20px;font-size:.9rem}
        .version{text-align:center;margin-top:20px;color:#777;font-size:.85rem}
        @media (max-width:768px){.login-container{padding:15px}.login-card{padding:20px}.login-title{font-size:1.7rem}}
    </style>
</head>
<body>
<div class="login-container">
<div class="login-card">
<h1 class="login-title">⚕️ SGCMED</h1>
<div class="login-subtitle">Acceso Seguro al Sistema</div>
<label for="correo">Correo Electrónico</label>
<input type="email" id="correo" placeholder="correo@dominio.com" autocomplete="username">
<label for="password">Contraseña</label>
<input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
<div style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
<input type="checkbox" id="mostrar-password"style="width:auto; margin:0;" >
<label for="mostrar-password" style="margin:0; cursor:pointer;" >
Mostrar contraseña
</label>
</div>
<button id="btn-login" class="btn-login">🔐 Ingresar</button>
<div id="mensaje" class="mensaje-error"></div>
<div style="text-align:center; margin-top:10px;"><a id="link-recuperar" href="#" style="color:#0d6efd; text-decoration:none;">¿Olvidó su contraseña?</a></div>
<div class="version">SGCMED - Ambiente de Pruebas</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/login.js"></script>
</body>
</html>
